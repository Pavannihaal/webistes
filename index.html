<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL Sustainability Quiz</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="screen active">
                <h1>Sustainability Quiz</h1>
                <p class="subtitle">NPTEL Course Portal</p>
                
                <div class="main-actions">
                    <div class="weekly-section">
                        <h3>Weekly Practice & Resources</h3>
                        <div class="weekly-grid" id="weekly-grid">
                            <!-- Cards generated by JS -->
                        </div>
                    </div>

                    <div class="review-section">
                        <button id="start-review-test" class="btn btn-primary full-width-btn">
                            <span>🔍 Review All Shuffled</span>
                            <small>Continuous practice for all 120 questions</small>
                        </button>
                    </div>

                    <div style="text-align: center; margin-top: 10px;">
                        <button onclick="exitApp()" class="btn-exit-portal">Exit Quiz Portal</button>
                    </div>
                </div>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="screen">
                <div class="quiz-nav">
                    <button onclick="goToHome()" class="exit-btn">🏠 Exit</button>
                    <span id="question-number">Question 1</span>
                </div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div id="question-container">
                    <p id="question-text" class="question-text">Loading question...</p>
                    <div id="options-container" class="options-container">
                        <!-- Options generated by JS -->
                    </div>
                </div>

                <div class="quiz-footer" style="margin-top: 30px; display: flex; justify-content: space-between; gap: 15px;">
                    <button id="prev-btn" class="btn btn-outline" style="flex: 1; min-height: 50px;">Previous</button>
                    <button id="next-btn" class="btn btn-primary" style="flex: 1; min-height: 50px;" disabled>Next Question</button>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="screen">
                <h1>Test Complete!</h1>
                <div class="score-circle">
                    <span id="score-value" class="score-value">0</span>
                    <span>Score</span>
                </div>
                
                <p id="score-message" style="text-align: center; font-weight: 600;"></p>

                <div class="result-detail" id="result-detail">
                    <!-- Correct/Wrong breakdown -->
                </div>

                <div class="btn-group" style="margin-top: 30px; display: flex; flex-direction: row; gap: 10px;">
                    <button onclick="location.reload()" class="btn btn-outline" style="flex: 1;">Restart Quiz</button>
                    <button onclick="goToHome()" class="btn btn-primary" style="flex: 1;">🏠 Home</button>
                </div>
            </div>
        </div>
    </div>

    <script src="question1.js"></script>
    <script src="script.js"></script>
</body>
</html>
